name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: Format
        run: uv run --python ${{ matrix.python-version }} ruff format --check
      - name: Import contracts
        run: uv run --python ${{ matrix.python-version }} lint-imports
      - name: Type check
        run: uv run --python 3.12 mypy src tests
      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest
