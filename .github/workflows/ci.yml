name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [packages/pleiad, apps/weave]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.22"
      - name: Install Python
        run: uv python install 3.12
      - uses: actions/setup-node@v4
        if: matrix.project == 'apps/weave'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/weave/web/package-lock.json
      - name: Build and test Web
        if: matrix.project == 'apps/weave'
        run: |
          npm --prefix apps/weave/web ci
          npm --prefix apps/weave/web run format:check
          npm --prefix apps/weave/web test
          npm --prefix apps/weave/web run build
      - name: Sync this project
        run: uv sync --project "${{ matrix.project }}" --locked --all-groups --all-extras --python 3.12
      - name: Check formatting
        run: uv run --directory "${{ matrix.project }}" --frozen ruff format --check .
      - name: Lint
        run: uv run --directory "${{ matrix.project }}" --frozen ruff check .
      - name: Type check
        run: uv run --directory "${{ matrix.project }}" --frozen mypy
      - name: Test
        run: uv run --directory "${{ matrix.project }}" --frozen pytest -q -m 'not packaging and not oci and not provider_e2e'
      - name: Check package ownership and pre-commit hooks
        if: matrix.project == 'apps/weave'
        run: |
          uv run --project apps/weave --frozen lint-imports --config .importlinter
          uv run --project apps/weave --frozen pre-commit run --all-files --show-diff-on-failure

  package:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.22"
      - name: Install Python
        run: uv python install 3.12
      - name: Sync App test environment
        run: uv sync --project apps/weave --locked --all-groups --all-extras --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/weave/web/package-lock.json
      - name: Build packaged Web resources
        run: |
          npm --prefix apps/weave/web ci
          npm --prefix apps/weave/web run build
      - name: Fresh build and clean-install smoke
        run: uv run --directory apps/weave --frozen pytest -q -m packaging tests/packaging
