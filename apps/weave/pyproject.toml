[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pleiad-weave"
version = "0.1.0"
description = "The official Agent application built on Pleiad."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pleiad[mcp]==0.1.2",
    "opentelemetry-api>=1.44.0,<2.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx[socks]>=0.28.1,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "python-multipart>=0.0.33,<0.1.0",
    "py-key-value-aio>=0.4.6,<1.0.0",
    "textual>=0.60.0,<1.0.0",
    "typer>=0.16.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
openai = ["pleiad[openai]==0.1.2"]
anthropic = ["pleiad[anthropic]==0.1.2"]
glm = ["pleiad[glm]==0.1.2"]
qwen = ["pleiad[qwen]==0.1.2"]
kimi = ["pleiad[kimi]==0.1.2"]
deepseek = ["pleiad[deepseek]==0.1.2"]
minimax = ["pleiad[minimax]==0.1.2"]
observability = ["pleiad[observability]==0.1.2"]
models = ["pleiad[models]==0.1.2"]

[project.scripts]
pleiad = "pleiad_weave.cli:app"

[dependency-groups]
dev = [
    "import-linter>=2.3.0,<3.0.0",
    "mypy>=1.17.0,<2.0.0",
    "openai>=2.0.0,<3.0.0",
    "opentelemetry-sdk>=1.44.0,<2.0.0",
    "packaging>=25.0,<27.0",
    "pre-commit>=4.3.0,<5.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff==0.15.22",
    "types-jsonschema>=4.25.0,<5.0.0",
]

[tool.uv.sources]
pleiad = { path = "../../packages/pleiad", editable = true }

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
pleiad_weave = "src"

[tool.setuptools.package-data]
pleiad_weave = ["py.typed"]
"pleiad_weave.resources" = [
    "skills/*.md",
    "sandbox/images/python/Dockerfile",
    "sandbox/images/python/requirements.lock",
]
"pleiad_weave.tui" = ["README.md", "styles/*.tcss"]
"pleiad_weave.web" = ["assets/index.html", "assets/assets/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "C4", "D", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]
"**/tests/**/*.py" = ["D", "S101"]
"**/__init__.py" = ["D104"]
"src/**/*.py" = ["D"]
"src/tui/**/*.py" = ["D", "RUF001"]
"src/agent/prompt.py" = ["RUF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["pleiad_weave"]

[tool.mypy]
packages = ["pleiad_weave", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = ["possibly-undefined", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "unit: fast application unit tests",
    "contract: public protocol and architecture contract tests",
    "integration: fake-model or local integration tests",
    "oci: tests requiring an OCI runtime",
    "packaging: fresh distribution build and clean-install tests",
    "provider_e2e: tests requiring a real model provider",
]

[tool.uv]
config-settings-package.pleiad = { editable_mode = "strict" }
config-settings-package.pleiad-weave = { editable_mode = "strict" }
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "LICENSE" },
    { file = "src/**/*.py" },
    { file = "src/py.typed" },
    { file = "src/**/*.md" },
    { file = "src/**/*.tcss" },
    { file = "src/web/assets/**/*" },
    { file = "src/resources/sandbox/images/python/Dockerfile" },
    { file = "src/resources/sandbox/images/python/requirements.lock" },
]
